<!DOCTYPE html>
<html>
<head>
  <title>Verdex - Green Score for Indian Cities</title>
  <meta name="description" content="Check the Green Score for any neighbourhood in India — air quality, heat and green cover in one number.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .suggestion-item:hover { background: var(--tw-color-gray-50); }
    .aqi-pin { border-radius: 50%; width: 18px; height: 18px; border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
    /* Deliberately distinct from .aqi-pin on size, border weight, icon
       presence, and a fixed color that never varies by score band — so it
       can never be mistaken for a neighbourhood score pin. */
    .user-location-pin {
      border-radius: 50%; width: 26px; height: 26px; border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45); background: #2563eb;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 13px;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <div class="max-w-2xl mx-auto mt-12 p-8">

    <div class="mb-8">
      <h1 class="text-4xl font-bold text-green-700 mb-2">Verdex</h1>
      <p class="text-gray-500">Green scores for every neighbourhood in India — live data.</p>
    </div>

    <!-- Real Address Search (Nominatim/OpenStreetMap geocoding) — sole
         search entry point now that Smart Search has been removed; the
         dropdown picker below is still separate and independent. -->

      <label class="block text-sm text-gray-500 mb-2">Search any area, landmark or city</label>

        id="address-search-input"

    </div>

    <div class="mb-6">

          <select id="neighbourhood-a"
            class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white">

            <option value="delhi">Delhi</option>
            <option value="bangalore">Bangalore</option>
            <option value="chennai">Chennai</option>

          class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-700 bg-white">
          <option value="hyderabad">Hyderabad</option>
          <option value="mumbai">Mumbai</option>
          <option value="delhi">Delhi</option>
          <option value="bangalore">Bangalore</option>
          <option value="chennai">Chennai</option>

  <!-- Info Modal -->

  <script>

    // --- SUPABASE (read-only, client-side) ---
    // The anon/publishable key is designed to be embedded in browser code —
    // access is controlled by Supabase Row Level Security policies on the
    // table, not by keeping this key secret.
    const SUPABASE_URL      = "https://dydqiislptgwaoiprwxh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rn1V_hZdE9NVpvOBP0fqSw_OvbNJOvS";

    // --- CACHE ---
    const cache = {};
    const CACHE_DURATION = 10 * 60 * 1000;

    // Tracks live Chart.js instances by chartId so repeated lookups can
    // destroy the previous chart before the DOM node it was bound to gets
    // replaced (avoids leaking Chart.js instances over a session).
    const aqiTrendCharts = {};

    // Same registry pattern for the daily-history view, plus a separate
    // flag tracking whether it's been fetched yet for the current card
    // render (it loads lazily on first "History" tab click, unlike the
    // hourly chart above which loads eagerly) — see loadDailyTrend.
    const dailyTrendCharts = {};
    const dailyTrendLoadedFor = {};

    // Map view state — one Leaflet map instance reused across city switches.
    // userLocation/userMarker/userLine are session-only, in-memory state for
    // the "you are here" marker — never sent anywhere, cleared on any new
    // search/lookup or on leaving map view (see clearUserLocationPin()).
    const mapState = {
      initialized: false, leafletMap: null, markers: [],
      userLocation: null, userMarker: null, userLine: null
    };

    function getCached(key) {
      if (!cache[key]) return null;
      if (Date.now() - cache[key].timestamp > CACHE_DURATION) { delete cache[key]; return null; }
      return cache[key].data;
    }

    function setCached(key, data) {
      cache[key] = { data, timestamp: Date.now() };
    }

    // --- REAL ADDRESS SEARCH (Nominatim, via server-side /api/geocode) ---
    //
    // Sole search entry point (Smart Search's local-match + Open-Meteo
    // geocoder fallback was removed). On selection it reuses
    // findNearestNeighbourhood() and
    // loadExactLocationNdvi() — the same functions locateMe() already
    // uses — rather than duplicating that logic. Nearby Places
    // intentionally shows the MATCHED neighbourhood's pre-computed data
    // (fetchAreaData already does this), not a live per-address Overpass
    // call — deferred to the Month 2 grid-cache mechanism (see the
    // Gowlidoddy pilot), which will let this snap to a nearby pre-computed
    // cell instead.
    let addressSearchTimeout = null;
    let addressSearchRequestId = 0;
    let addressSelectedIndex = -1;
    let currentAddressSuggestions = [];
    let addressSearchSessionId = null;

    // One ID per "typing session" (first keystroke until a selection is
    // made or the page reloads) — lets the geocode_attempts log answer
    // "how often did someone need a second/third search to find their
    // address" via a query, without baking that computation in here.
    function getAddressSearchSessionId() {
      if (!addressSearchSessionId) {
        addressSearchSessionId = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }
      return addressSearchSessionId;
    }

    // Reused verbatim from the old Smart Search (removed along with that
    // box, restored here): matches when a KNOWN neighbourhood/city NAME
    // contains the typed text, not the reverse. That direction is what
    // makes this safe to auto-fire on every keystroke with zero
    // ambiguity — "Banjara Hills" matches the name directly, but "Road 12,
    // Banjara Hills" can never match (a 13-char name can't contain a
    // 22-char query), so specific addresses fall through to Nominatim
    // below untouched, without needing any separate heuristic.
    function searchLocalData(query) {
      const q = query.toLowerCase();
      const results = [];
      Object.keys(cities).forEach(city => {
        cities[city].forEach(n => {
          if (n.name.toLowerCase().includes(q) || city.includes(q)) {
            results.push({
              name: n.name,
              detail: city.charAt(0).toUpperCase() + city.slice(1),
              lat: n.lat,
              lon: n.lon
            });
          }
        });
      });
      return results.slice(0, 6);
    }

    async function handleAddressSearch() {
      const query = document.getElementById('address-search-input').value.trim();
      const box   = document.getElementById('address-suggestions-box');
      const spin  = document.getElementById('address-search-spinner');

      // Bumped on every keystroke (not just when a Nominatim call fires)
      // so an in-flight Nominatim response from an earlier keystroke
      // recognizes itself as stale the moment ANYTHING newer is shown —
      // local suggestions included — and can't clobber them when it
      // finally resolves. Without this, typing "Road" (no local match,
      // schedules Nominatim) then backspacing to "Banjara Hills" (local
      // match, instant render) could still get overwritten a second later
      // when the first request comes back.
      const requestId = ++addressSearchRequestId;
      clearTimeout(addressSearchTimeout);

      if (query.length < 3) { box.classList.add('hidden'); return; }

      // Instant, zero-network check against the 80 known neighbourhoods
      // first — same local-array-filter approach the old Smart Search
      // used. Short-circuits entirely on a match: no debounce, no
      // Nominatim call, matching the old box's exact behavior.
      const localResults = searchLocalData(query);
      if (localResults.length > 0) {
        showAddressSuggestions(localResults.map(r => ({
          displayName: `${r.name}, ${r.detail}`,
          lat: r.lat,
          lon: r.lon
        })));
        return;
      }

      // Nominatim's usage policy requires >=1 request/second spacing —
      // longer than the old Smart Search's 400ms debounce, deliberately.
      addressSearchTimeout = setTimeout(async () => {
        spin.classList.remove('hidden');
        try {
          // Bias/restrict to whichever city is currently selected in the
          // dropdown picker — without this, a query like "Wipro Circle"
          // with no city name in it ranks purely on Nominatim's own
          // importance score, which can surface a same-named place in a
          // totally different city ahead of the one actually being browsed.
          const selectedCity = document.getElementById('city-select').value;
          const url = "/api/geocode?q=" + encodeURIComponent(query)
            + "&session=" + getAddressSearchSessionId()
            + "&city=" + encodeURIComponent(selectedCity);
          const res  = await fetch(url);
          const data = await res.json();

          // A newer keystroke already fired another request while this one
          // was in flight — drop this now-stale response so a slow older
          // reply can't clobber fresher suggestions on screen.
          if (requestId !== addressSearchRequestId) return;

          if (data.results && data.results.length > 0) {
            showAddressSuggestions(data.results);
          } else {
            box.innerHTML = '<div class="px-4 py-3 text-sm text-gray-400">No results found</div>';
            box.classList.remove('hidden');
          }
        } catch (e) {
          if (requestId === addressSearchRequestId) box.classList.add('hidden');
          console.warn("Address search request failed.", e.message);
        }
        if (requestId === addressSearchRequestId) spin.classList.add('hidden');
      }, 1000);
    }

    function showAddressSuggestions(results) {
      currentAddressSuggestions = results;
      addressSelectedIndex = -1;
      const box = document.getElementById('address-suggestions-box');
      box.innerHTML = results.map((r, i) => `
        <div class="suggestion-item px-4 py-3 cursor-pointer border-b border-gray-100 last:border-0 hover:bg-gray-50"
          onclick="selectAddressSuggestion(${i})">
          <div class="text-sm font-medium text-gray-800">${r.displayName}</div>
        </div>
      `).join('');
      box.classList.remove('hidden');
    }

    function handleAddressKeydown(e) {
      const box = document.getElementById('address-suggestions-box');
      if (box.classList.contains('hidden')) return;
      const items = box.querySelectorAll('.suggestion-item');

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        addressSelectedIndex = Math.min(addressSelectedIndex + 1, items.length - 1);
        items.forEach((el, i) => el.style.background = i === addressSelectedIndex ? '#f9fafb' : '');
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        addressSelectedIndex = Math.max(addressSelectedIndex - 1, 0);
        items.forEach((el, i) => el.style.background = i === addressSelectedIndex ? '#f9fafb' : '');
      } else if (e.key === 'Enter' && addressSelectedIndex >= 0) {
        selectAddressSuggestion(addressSelectedIndex);
      } else if (e.key === 'Escape') {
        box.classList.add('hidden');
      }
    }

    async function selectAddressSuggestion(index) {
      const s   = currentAddressSuggestions[index];
      const box = document.getElementById('address-suggestions-box');
      document.getElementById('address-search-input').value = s.displayName;
      box.classList.add('hidden');

      clearUserLocationPin();
      setMode('single');
      const statusEl = document.getElementById('single-status');
      const resultEl = document.getElementById('single-result');
      statusEl.innerHTML = getSpinner();
      resultEl.classList.add('hidden');

      const nearest = findNearestNeighbourhood(s.lat, s.lon);
      if (!nearest || nearest.distanceKm > LOCATE_ME_MAX_DISTANCE_KM) {
        statusEl.innerHTML = '';
        resultEl.innerHTML = `<div class="text-center text-sm text-gray-500">No closely-matched neighbourhood found for this address.</div>`;
        resultEl.classList.remove('hidden');
        return;
      }

      const { entry, city, distanceKm } = nearest;
      const value = entry.lat + '|' + entry.lon + '|' + entry.name + '|' + entry.ndvi + '|' +
        entry.noise + '|' + entry.water + '|' + entry.traffic + '|' + entry.safety + '|' + entry.infra + '|' + entry.walk;

      try {
        // Run in parallel, not sequentially after fetchAreaData — the
        // grid lookup is a small, independent request and shouldn't add
        // latency on top of the existing search.
        const [d, gridResult] = await Promise.all([
          fetchAreaData(city, value),
          getHyderabadGridPlaces(s.lat, s.lon)
        ]);
        statusEl.innerHTML = '';

        let nearbyPlacesSource = "area";
        if (gridResult.inGrid) {
          d.nearbyPlaces = { places: gridResult.places };
          nearbyPlacesSource = "exact";
        }

        const distanceNote = `
          <div class="text-center text-sm text-gray-500 mb-3">
            Closest matched area: <span class="font-medium text-gray-700">${d.name}</span>
            (${distanceKm.toFixed(1)}km from the searched address)
          </div>`;
        const ndviContainerId = "exact-ndvi-address";
        const exactNdviBlock = `
          <div class="mt-4 bg-white border border-gray-100 rounded-2xl p-4 text-sm" id="${ndviContainerId}">
            <div class="text-xs text-gray-500 mb-1">Green cover${precisionTag("exact for this point")}</div>
            <div id="${ndviContainerId}-status" class="text-xs text-gray-400">Loading…</div>
          </div>`;

        resultEl.innerHTML = distanceNote + buildScoreCard(d, false, 'single', true, nearbyPlacesSource) + exactNdviBlock;
        resultEl.classList.remove('hidden');
        resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        loadAqiTrend(d.name, d.city, 'single');
        loadExactLocationNdvi(s.lat, s.lon, ndviContainerId);
      } catch (err) {
        statusEl.innerHTML = 'Could not load data. Check console (F12).';
        console.error(err);
      }
    }

    // Close address suggestions when clicking outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#address-search-input') && !e.target.closest('#address-suggestions-box')) {
        document.getElementById('address-suggestions-box').classList.add('hidden');
      }
    });

    // --- INFO MODAL ---
    const infoContent = {
      aqi: {
        title: "Air Quality Index (AQI)",
        body: `AQI measures how clean or polluted the air is right now.<br><br>
          <b>0–50</b> → Good. Air is clean, safe to breathe.<br>
          <b>51–100</b> → Satisfactory. Minor discomfort for sensitive people.<br>
          <b>101–150</b> → Moderate. People with asthma may feel effects.<br>
          <b>151–200</b> → Poor. Everyone may start to feel effects.<br>
          <b>200+</b> → Very Poor. Avoid outdoor activity.<br><br>
          Data is sourced live from government monitoring stations.`
      },
      heat: {
        title: "Feels Like",
        body: `This shows how hot it <i>actually feels</i> — not just the temperature.<br><br>
          Humidity makes heat feel much worse. 32°C with 80% humidity feels like 40°C.<br><br>
          <b>Below 25°C</b> → Very comfortable<br>
          <b>25–30°C</b> → Comfortable<br>
          <b>30–35°C</b> → Warm, manageable<br>
          <b>35–40°C</b> → Hot, uncomfortable<br>
          <b>40°C+</b> → Very hot, health risk<br><br>
          Data is sourced live from weather stations.`
      },
      ndvi: {
        title: "Green Cover (NDVI)",
        body: `NDVI measures how much healthy vegetation exists in an area, captured by satellites.<br><br>
          <b>40% and above</b> → Well vegetated. Lots of trees and parks.<br>
          <b>20–40%</b> → Moderate greenery. Some trees and grass.<br>
          <b>0–20%</b> → Sparse. Mostly concrete and roads.<br><br>
          Data comes from European Space Agency satellites photographing India every 5 days.`
      },
      noise: {
  title: "Noise Pollution",
  body: `Measures proximity to major roads (motorways, trunk and primary/secondary roads) and active railway lines — whichever is closer determines the score, since noise doesn't average out, the nearer source dominates.<br><br>
    <b>Above 6</b> → Quiet. Well clear of major roads and railway lines.<br>
    <b>4–6</b> → Moderate. Some distance from a major road or railway line, but not far.<br>
    <b>Below 4</b> → Loud. Very close to a major road or an active railway line.<br><br>
    Based on real distances to the nearest major road and railway line (OpenStreetMap), refreshed periodically — not a live measurement.`
},
      water: {
        title: "Water Quality",
        body: `Measures how safe and usable the local water supply is, based on Total Dissolved Solids (TDS) — a standard indicator of dissolved salts, minerals and contaminants.<br><br>
          <b>0–300 ppm</b> → Excellent. Well within safe limits.<br>
          <b>300–500 ppm</b> → Good. Within BIS acceptable limits.<br>
          <b>500–700 ppm</b> → Fair. Noticeable taste, filtration advisable.<br>
          <b>700–900 ppm</b> → Poor. Filtration recommended.<br>
          <b>900+ ppm</b> → Very poor. Filtration essential.<br><br>
          Based on researched baseline data for each neighbourhood, referenced against CPCB/BIS drinking water standards.`
      },
      infrastructure: {
        title: "Infrastructure",
        body: `Measures real distances to the nearest hospital, clinic, school, college, police station, fire station, grocery store, pharmacy and ATM/bank — sourced from OpenStreetMap via the same Nearby Places data.<br><br>
          <b>80–100</b> → Well served. Most essential amenities close by.<br>
          <b>60–80</b> → Adequately served.<br>
          <b>40–60</b> → Limited amenities nearby.<br>
          <b>Below 40</b> → Sparse amenities, longer trips required.<br><br>
          Based on real OpenStreetMap distances, refreshed periodically — not a live per-request lookup.`
      },
      walkability: {
        title: "Transit & Amenity Access",
        body: `Measures proximity to transit (bus stops and metro stations) and density of nearby restaurants/cafes — not general street walkability or pedestrian comfort.<br><br>
          <b>80–100</b> → Excellent access. Transit and food/amenities close by.<br>
          <b>60–80</b> → Good access.<br>
          <b>40–60</b> → Limited access.<br>
