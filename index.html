    function updateNeighbourhoods(selectId, citySelectId) {
      let city   = document.getElementById(citySelectId).value;
      let select = document.getElementById(selectId);
      select.innerHTML = "";
      cities[city].forEach(function(n) {
        let option   = document.createElement("option");
        option.value = n.lat + "|" + n.lon + "|" + n.name + "|" + n.ndvi + "|" + n.noise + "|" + n.water + "|" + n.traffic + "|" + n.safety + "|" + n.infra + "|" + n.walk;
        option.text  = n.name;
        select.appendChild(option);
      });
    }

    const MODE_BTN_ACTIVE   = "px-5 py-2 rounded-lg text-sm font-medium bg-green-600 text-white";
    const MODE_BTN_INACTIVE = "px-5 py-2 rounded-lg text-sm font-medium bg-white border border-gray-200 text-gray-600";

    // Removes the "you are here" marker/line and forgets the located
    // position — called whenever the person moves on to something else
    // (a new search/lookup, or leaving map view), since a stale location
    // dot from a previous "Locate me" tap shouldn't linger into an
    // unrelated context.
    function clearUserLocationPin() {
      if (mapState.userMarker) { mapState.userMarker.remove(); mapState.userMarker = null; }
      if (mapState.userLine)   { mapState.userLine.remove();   mapState.userLine   = null; }
      mapState.userLocation = null;
    }

    function setMode(mode) {
      const modes = ["single", "compare", "map"];
      modes.forEach(m => {
        document.getElementById(m + "-mode").classList.toggle("hidden", m !== mode);
        document.getElementById("btn-" + m).className = m === mode ? MODE_BTN_ACTIVE : MODE_BTN_INACTIVE;
      });

      if (mode !== "map") {
        clearUserLocationPin();
        return;
      }

      if (mapState.userLocation) {
        // A "Locate me" match is active — sync the map to that city so the
        // person's marker actually shows, even if the map was already
        // showing a different city before.
        const citySelect = document.getElementById("city-map-select");
        citySelect.value = mapState.userLocation.city;
        loadCityMap(citySelect.value);
      } else if (!mapState.initialized) {
        loadCityMap(document.getElementById("city-map-select").value);
      }
    }

    function calculateAQIScore(aqi) {
      return parseFloat(Math.max(0, Math.min(10, 10 - (aqi / 50))).toFixed(1));
    }

    function calculateHeatScore(feelsLike) {
      return parseFloat(Math.max(0, Math.min(10, 10 - Math.max(0, feelsLike - 20) * 0.4)).toFixed(1));
    }

    function calculateNDVIScore(ndvi) {
      return parseFloat(Math.max(0, Math.min(10, ndvi * 10)).toFixed(1));
    }

    function calculateWaterScore(tds) {
      return parseFloat(Math.max(0, Math.min(10, 10 - (tds / 100))).toFixed(1));
    }

    function getScoreColor(score) {
      if (score >= 7) return "text-green-500";
      if (score >= 5) return "text-orange-400";
      return "text-red-500";
    }

    function getScoreLabel(score) {
      if (score >= 8) return "Excellent";
      if (score >= 6) return "Good";
      if (score >= 4) return "Moderate";
      return "Poor";
    }

    function getAQILabel(aqi) {
      if (aqi <= 50)  return "Good";
      if (aqi <= 100) return "Satisfactory";
      if (aqi <= 150) return "Moderate";
      if (aqi <= 200) return "Poor";
      return "Very Poor";
    }

    function getNDVILabel(ndvi) {
      if (ndvi >= 0.4) return "Well vegetated";
      if (ndvi >= 0.2) return "Moderate greenery";
      return "Sparse greenery";
    }

    function getWaterLabel(tds) {
      if (tds <= 300) return "Excellent";
      if (tds <= 500) return "Good";
      if (tds <= 700) return "Fair";
      if (tds <= 900) return "Poor";
      return "Very poor";
    }

    function getInfraLabel(score) {
      if (score >= 8) return "Well served";
      if (score >= 6) return "Adequately served";
      if (score >= 4) return "Limited amenities";
      return "Sparse amenities";
    }

    function getWalkLabel(score) {
      if (score >= 8) return "Excellent access";
      if (score >= 6) return "Good access";
      if (score >= 4) return "Limited access";
      return "Poor access";
    }

    function getTrafficLabel(score) {
      if (score >= 7) return "Free-flowing";
      if (score >= 5) return "Moderate congestion";
      if (score >= 3) return "Heavy congestion";
      return "Severe congestion";
    }

    function getSafetyLabel(score) {
      if (score >= 7.5) return "Well lit, active area";
      if (score >= 6) return "Generally well served";
      return "Quieter, less foot traffic";
    }

    // Immersive-cards display bands — separate from getScoreColor/getScoreLabel
    // above (different thresholds/labels), operates on the same 0-10 scores.
    // `pin` is a saturated variant of the same band color for use on map
    // markers, where the pale `bg` card-tint would be nearly invisible —
    // kept in this one function so every band-color consumer (cards, map
    // pins) shares a single source of truth.
    function getBandInfo(score10) {
      if (score10 >= 8.0) return { label: "Excellent", text: "text-emerald-600", bg: "bg-emerald-50", pin: "bg-emerald-500" };
      if (score10 >= 6.0) return { label: "Good",      text: "text-blue-600",    bg: "bg-blue-50",    pin: "bg-blue-500" };
      if (score10 >= 4.0) return { label: "Fair",       text: "text-amber-600",  bg: "bg-amber-50",   pin: "bg-amber-500" };
      return                     { label: "Poor",       text: "text-red-600",    bg: "bg-red-50",     pin: "bg-red-500" };
    }

    function avgScore(...vals) {
      return parseFloat((vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1));
    }

    function getSpinner() {
      return `<div class="flex items-center justify-center gap-2 mt-4">
        <div style="width:16px;height:16px;border:2px solid #16a34a;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
        <span>Fetching live data — takes 5–10 seconds...</span>
      </div>`;
    }

    function infoBtn(type) {
      return `<button onclick="showInfo('${type}')"
        class="ml-1 w-4 h-4 rounded-full bg-gray-200 text-gray-500 text-xs font-bold hover:bg-gray-300 inline-flex items-center justify-center"
        style="font-size:10px;line-height:1">i</button>`;
    }

    // Static, periodically-refreshed batch data (nearest hospital, school,
    // grocery, transit, etc. per neighbourhood — see CATEGORY_DEFS in
    // scripts/fetch-nearby-places.mjs) — fetched once per page session and
    // cached in memory, never re-fetched live per search.
    let nearbyPlacesIndex = null;
    async function getNearbyPlacesIndex() {
      if (nearbyPlacesIndex) return nearbyPlacesIndex;
      try {
        const res = await fetch("/data/nearby-places.json");
        const arr = await res.json();
        nearbyPlacesIndex = new Map(arr.map(e => [e.city + "|" + e.name, e]));
      } catch (e) {
        console.warn("Failed to load nearby-places.json — nearby places section will show as unavailable.", e.message);
        nearbyPlacesIndex = new Map();
      }
      return nearbyPlacesIndex;
    }

    // Client-side counterpart to api/_lib/http.js's fetchJsonWithTimeout —
    // same "clear the timer in finally, cover the full response read" shape,
    // needed here specifically for the Open-Meteo weather call below, which
    // (unlike /api/aqi and /api/ndvi) goes straight from the browser to a
    // third party with no server proxy and, until now, no timeout at all —
    // the same "hangs forever on a slow response" bug class fixed elsewhere
    // tonight, just never covered because it isn't one of our own /api/*
    // routes.
    async function fetchJsonWithTimeoutClient(url, ms) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), ms);
      try {
        const res = await fetch(url, { signal: controller.signal });
        const data = await res.json();
        return { ok: res.ok, status: res.status, data };
      } finally {
        clearTimeout(timeoutId);
      }
    }
    const WEATHER_TIMEOUT_MS = 8000;

    async function fetchAreaData(city, neighbourhoodValue) {
      let parts = neighbourhoodValue.split("|");
      let lat   = parts[0];
      let lon   = parts[1];
      let name  = parts[2];
      let ndvi    = parseFloat(parts[3]);
let noise   = parseFloat(parts[4]) || 5.0;
let water   = parseFloat(parts[5]) || 400;
let traffic = parseFloat(parts[6]) || 5.0;
let safety  = parseFloat(parts[7]) || 6.5;
let infra   = parseFloat(parts[8]) || 6.0;
let walk    = parseFloat(parts[9]) || 6.0;
      // Looked up directly from the cities object rather than the pipe-delimited
      // value string, since it's an array of objects, not a scalar.
      let neighbourhoodEntry = (cities[city] || []).find(n => n.name === name);
      let nearbyProjects = (neighbourhoodEntry && neighbourhoodEntry.nearbyProjects) || [];
      let nearbyPlaces = (await getNearbyPlacesIndex()).get(city + "|" + name) || null;
      // Fetch live NDVI from satellite. api/ndvi.js distinguishes a real
      // failure (non-2xx status: auth broken, upstream rejected the
      // request, etc.) from a legitimate empty result (200 with ndvi:null,
      // e.g. no cloud-free imagery available) — every fallback-to-baseline
      // path here logs which one happened, so this never fails silently
      // the way it used to (a 401 with a JSON body doesn't throw, so the
      // old code's try/catch never even saw it).
      let ndviIsEstimated = true;
      try {
        const ndviRes  = await fetch("/api/ndvi?lat=" + lat + "&lon=" + lon);
        const ndviData = await ndviRes.json();
        if (!ndviRes.ok) {
          console.warn(`Live NDVI request failed (HTTP ${ndviRes.status}) — using baseline value. Reason: ${ndviData.reason || ndviData.error || "unknown"}`);
        } else if (typeof ndviData.ndvi === "number") {
          ndvi = ndviData.ndvi;
          ndviIsEstimated = false;
        } else {
          console.warn(`Live NDVI returned no usable reading — using baseline value. Reason: ${ndviData.reason || "unknown"}`);
        }
      } catch (e) {
        console.warn("Live NDVI fetch threw an exception (network/parse error) — using baseline value.", e.message);
      }

      let cacheKey = city + "|" + lat + "|" + lon;
      let cached   = getCached(cacheKey);
      if (cached) return cached;

      // temp/windSpeed/feelsLike/humidity have no per-neighbourhood or even
      // per-city baseline anywhere in this app — unlike ndvi/aqi, these four
      // constants are the ONLY fallback that has ever existed, applied
      // identically regardless of neighbourhood or city. Worth knowing: the
      // "(estimated)" label below is honest about live vs. not, but on a
      // fallback it's a flat global guess, not a location-specific one.
      let temp = 30, windSpeed = 10, feelsLike = 32, humidity = 60;
      let weatherIsEstimated = true;
      try {
        let weatherURL = "https://api.open-meteo.com/v1/forecast"
          + "?latitude="  + lat
          + "&longitude=" + lon
          + "&current_weather=true"
          + "&hourly=relativehumidity_2m,apparent_temperature"
          + "&timezone=Asia/Kolkata"
          + "&forecast_days=1";
        let { ok: weatherOk, status: weatherStatus, data: weatherData } = await fetchJsonWithTimeoutClient(weatherURL, WEATHER_TIMEOUT_MS);
        if (!weatherOk) {
          console.warn(`Live weather request failed (HTTP ${weatherStatus}) — using fallback estimate.`);
        } else {
          let currentHour = new Date().getHours();
          temp      = weatherData.current_weather.temperature;
          windSpeed = weatherData.current_weather.windspeed;
          feelsLike = weatherData.hourly.apparent_temperature[currentHour];
          humidity  = weatherData.hourly.relativehumidity_2m[currentHour];
          weatherIsEstimated = false;
        }
      } catch (e) {
        if (e.name === "AbortError") {
          console.warn("Live weather request timed out — using fallback estimate.");
        } else {
          console.warn("Live weather fetch threw an exception (network/parse error) — using fallback estimate.", e.message);
        }
      }

      let aqi = null;
      let aqiIsEstimated = true;
      try {
        let { ok: aqiOk, status: aqiStatus, data: aqiData } = await fetchJsonWithTimeoutClient("/api/aqi?lat=" + lat + "&lon=" + lon + "&city=" + city, WEATHER_TIMEOUT_MS);
        if (!aqiOk) {
          console.warn(`Live AQI request failed (HTTP ${aqiStatus}) — using fallback estimate. Reason: ${(aqiData && (aqiData.error || aqiData.reason)) || "unknown"}`);
        } else if (typeof aqiData.aqi === "number") {
          aqi = aqiData.aqi;
          // api/aqi.js can itself fall back to a flat per-city guess
          // (method: "fallback") when live station lookups complete but
          // find nothing usable — still a 200 with a normal-looking number,
          // so this has to be checked explicitly rather than inferred from
          // the fetch succeeding.
          aqiIsEstimated = aqiData.method === "fallback";
          if (aqiIsEstimated) console.warn("Live AQI lookup found no usable station — using city-level estimate.");
        } else {
          console.warn("Live AQI response missing a usable value — using fallback estimate.");
        }
      } catch (e) {
        if (e.name === "AbortError") {
          console.warn("Live AQI request timed out — using fallback estimate.");
        } else {
          console.warn("Live AQI fetch threw an exception (network/parse error) — using fallback estimate.", e.message);
        }
      }

      let aqiFallbacks = {
        hyderabad: 85, mumbai: 95, delhi: 150,
        bangalore: 65, chennai: 90, pune: 75,
        kolkata: 110, ahmedabad: 120
      };
      if (aqi === null) aqi = aqiFallbacks[city] || 100;

      let aqiScore     = calculateAQIScore(aqi);
let heatScore    = calculateHeatScore(feelsLike);
let ndviScore    = calculateNDVIScore(ndvi);
let noiseScore   = noise;
let waterScore   = calculateWaterScore(water);
let infraScore   = infra;
let walkScore    = walk;
let trafficScore = traffic;
let safetyScore  = safety;
let finalScore = parseFloat((
  (aqiScore     * 0.22) +
  (ndviScore    * 0.18) +
  (waterScore   * 0.15) +
  (heatScore    * 0.10) +
  (noiseScore   * 0.07) +
  (infraScore   * 0.10) +
  (walkScore    * 0.08) +
  (safetyScore  * 0.06) +
  (trafficScore * 0.04)
).toFixed(1));

      let result = {
        name, city, aqi, aqiScore, temp, feelsLike, humidity, windSpeed, heatScore,
        ndvi, ndviScore, noise, noiseScore, water, waterScore,
        infraScore, walkScore, traffic, trafficScore, safety, safetyScore,
        finalScore,
        // Display-only — whether the corresponding value above came from a
        // live fetch or fell back to a baseline/estimate. Never read by any
        // scoring function; aqiScore/heatScore/ndviScore are computed from
        // aqi/feelsLike/ndvi themselves regardless of source.
        aqiIsEstimated, weatherIsEstimated, ndviIsEstimated,
        // Informational only — deliberately excluded from finalScore above.
        nearbyProjects,
        nearbyPlaces
      };
      setCached(cacheKey, result);
      return result;
    }

    // --- IMMERSIVE CARDS (score hero + 3 layer cards) ---

    // Same visual treatment as the footer's "researched baseline data" line
    // (text-xs text-gray-400) — this reads as consistent with the app's
    // existing honesty pattern rather than a new one-off style.
    function estimatedTag(isEstimated) {
      return isEstimated ? ' <span class="text-xs text-gray-400 font-normal">(estimated)</span>' : '';
    }

    // Distinct from estimatedTag above — that one flags a per-request
    // fallback (did THIS number come from a live fetch or not), this one
    // flags a structural property of the parameter itself (is it EVER
    // computed for the exact searched point, or always tied to the matched
    // neighbourhood's own coordinate/baseline, regardless of live/fallback
    // status). The two are orthogonal and can co-occur, so this lives on
    // the label rather than sharing the value string with estimatedTag.
    function precisionTag(label) {
      return ` <span class="text-xs text-gray-400 font-normal">(${label})</span>`;
    }

    function buildParamRow(icon, label, valueHtml, infoType, colorClass) {
      colorClass = colorClass || "text-gray-400";
      return `
        <div class="flex justify-between items-start gap-2 border-t border-black/5 py-2.5 text-sm">
          <div class="flex items-center gap-2 text-gray-700 shrink-0">
            <i class="ti ${icon} ${colorClass} text-lg shrink-0"></i>
            <span class="font-medium whitespace-nowrap">${label} ${infoBtn(infoType)}</span>
          </div>
          <div class="font-semibold text-gray-700 text-right min-w-0">${valueHtml}</div>
        </div>`;
    }

    function buildLayerCardShell(icon, title, subScore10, summaryText, rowsHtml) {
      let band = getBandInfo(subScore10);
      return `
        <div class="${band.bg} rounded-2xl p-6">
          <div class="flex justify-between items-center gap-2 mb-1">
            <div class="flex items-center gap-2 min-w-0">
              <i class="ti ${icon} ${band.text} text-lg shrink-0"></i>
              <span class="font-semibold text-gray-800 truncate">${title}</span>
            </div>
            <span class="text-2xl font-bold ${band.text} shrink-0">${Math.round(subScore10 * 10)}</span>
          </div>
          <div class="text-sm text-gray-500 mb-1">${summaryText}</div>
          <div>${rowsHtml}</div>
        </div>`;
    }

    // isAreaEstimate: true only for locateMe/address-search results, where
    // a genuinely different "exact searched point" exists to contrast
    // against — every value here is actually computed from the MATCHED
    // NEIGHBOURHOOD's own coordinate/baseline (confirmed: fetchAreaData is
    // always called with entry.lat/entry.lon, never the exact searched
    // lat/lon), so labeling that plainly is honest, not a formality. Plain
    // dropdown/compare/map searches leave this false — there the
    // neighbourhood IS the search target, so the tag would be trivially
    // true with nothing to contrast against.
    function buildEnvironmentalCard(d, chartId, isAreaEstimate) {
      let areaTag = isAreaEstimate ? precisionTag("area estimate") : "";
      let envSubScore = avgScore(d.aqiScore, d.heatScore, d.ndviScore, d.noiseScore, d.waterScore);
      let rows = [
        buildParamRow("ti-wind", "Air Quality" + areaTag, `${d.aqi}${estimatedTag(d.aqiIsEstimated)} · ${getAQILabel(d.aqi)}`, "aqi", "text-green-500"),
        buildParamRow("ti-temperature", "Feels Like" + areaTag, `${d.feelsLike}°C${estimatedTag(d.weatherIsEstimated)} · ${d.humidity}% humidity`, "heat", "text-green-500"),
        buildParamRow("ti-tree", "Green Cover" + areaTag, `${Math.round(d.ndvi * 100)}%${estimatedTag(d.ndviIsEstimated)}`, "ndvi", "text-green-500"),
        buildParamRow("ti-volume", "Noise" + areaTag, `${d.noise <= 4 ? "High traffic area" : d.noise <= 6 ? "Moderate noise" : "Relatively quiet"} · ${d.noise}/10`, "noise", "text-green-500"),
        buildParamRow("ti-droplet", "Water Quality" + areaTag, `${getWaterLabel(d.water)} · ${d.water}ppm`, "water", "text-green-500")
      ].join("") + buildAqiTrendContainer(chartId, d.name, d.city);
      let summary = `Air quality ${getAQILabel(d.aqi).toLowerCase()}, ${getNDVILabel(d.ndvi).toLowerCase()}, water ${getWaterLabel(d.water).toLowerCase()}.`;
      return buildLayerCardShell("ti-leaf", "Environmental", envSubScore, summary, rows);
    }

    // Two tabs sharing one chart area: "Today" (existing hourly view,
    // unchanged, loads eagerly) and "History" (new daily-average view,
    // loads lazily — only fetched the first time someone actually clicks
    // it, see switchTrendView — since most card views may never open a
    // secondary trend, and eagerly fetching ~90 days of rows on every
    // single/compare/map render would double Supabase read load for a
    // view most people won't look at).
    function buildAqiTrendContainer(chartId, name, city) {
      const activeTab   = "text-xs font-medium px-2 py-1 rounded-full bg-gray-800 text-white";
      const inactiveTab = "text-xs font-medium px-2 py-1 rounded-full text-gray-500 hover:bg-gray-100";
      return `
        <div class="mt-3 pt-3 border-t border-black/5">
          <div class="flex items-center gap-2 mb-2">
            <button id="trend-tab-hourly-${chartId}" class="${activeTab}"
              onclick="switchTrendView('${chartId}','hourly','${name}','${city}')">Today</button>
            <button id="trend-tab-daily-${chartId}" class="${inactiveTab}"
              onclick="switchTrendView('${chartId}','daily','${name}','${city}')">History</button>
          </div>
          <div id="trend-view-hourly-${chartId}">
            <div id="aqi-trend-${chartId}-status" class="text-xs text-gray-400">Loading trend…</div>
            <div class="hidden" id="aqi-trend-${chartId}-chart-wrap" style="height:110px">
              <canvas id="aqi-trend-${chartId}-canvas"></canvas>
            </div>
          </div>
          <div class="hidden" id="trend-view-daily-${chartId}">
            <div class="text-xs text-gray-500 mb-1" id="daily-trend-${chartId}-label"></div>
            <div id="daily-trend-${chartId}-status" class="text-xs text-gray-400">Loading trend…</div>
            <div class="hidden" id="daily-trend-${chartId}-chart-wrap" style="height:110px">
              <canvas id="daily-trend-${chartId}-canvas"></canvas>
            </div>
          </div>
        </div>`;
    }

    function buildLiveabilityCard(d, isAreaEstimate) {
      let areaTag = isAreaEstimate ? precisionTag("area estimate") : "";
      let liveSubScore = avgScore(d.infraScore, d.walkScore, d.trafficScore, d.safetyScore);
      let rows = [
        buildParamRow("ti-building-hospital", "Infrastructure" + areaTag, `${Math.round(d.infraScore * 10)} · ${getInfraLabel(d.infraScore)}`, "infrastructure", "text-blue-500"),
        buildParamRow("ti-bus", "Transit & Amenity Access" + areaTag, `${Math.round(d.walkScore * 10)} · ${getWalkLabel(d.walkScore)}`, "walkability", "text-blue-500"),
        buildParamRow("ti-car", "Traffic" + areaTag, `${Math.round(d.trafficScore * 10)} · ${getTrafficLabel(d.trafficScore)}`, "traffic", "text-blue-500"),
        buildParamRow("ti-shield", "Safety" + areaTag, `${Math.round(d.safetyScore * 10)} · ${getSafetyLabel(d.safetyScore)}`, "safety", "text-blue-500")
      ].join("");
      let summary = `${getWalkLabel(d.walkScore)}, ${getTrafficLabel(d.trafficScore).toLowerCase()}, ${getSafetyLabel(d.safetyScore).toLowerCase()}.`;
      return buildLayerCardShell("ti-bus", "Liveability", liveSubScore, summary, rows);
    }

    // Mirrors the CATEGORY_DEFS keys in scripts/fetch-nearby-places.mjs —
    // label/icon are display-only, not needed server-side. label is the
    // short tile/modal-title form ("Hospital", not "Nearest hospital") —
    // the grid replaced the old row layout where the longer phrasing made
    // sense next to a distance value.
    const NEARBY_PLACE_META = {
      hospital:        { label: "Hospital",             icon: "ti-building-hospital" },
      clinic:          { label: "Clinic",                icon: "ti-stethoscope" },
      school:          { label: "School",                icon: "ti-school" },
      college:         { label: "College",                icon: "ti-books" },
      police:          { label: "Police",         icon: "ti-shield" },
      fire_station:    { label: "Fire station",           icon: "ti-flame" },
      grocery:         { label: "Grocery",          icon: "ti-shopping-cart" },
      pharmacy:        { label: "Pharmacy",                icon: "ti-pill" },
      atm_bank:        { label: "ATM/Bank",                icon: "ti-building-bank" },
      bus_stop:        { label: "Bus stop",                icon: "ti-bus" },
      metro_station:   { label: "Metro/Rail",      icon: "ti-train" },
      restaurant_cafe: { label: "Restaurant/Cafe",         icon: "ti-tools-kitchen-2" },
      park:            { label: "Park",                   icon: "ti-trees" },
      gym:             { label: "Gym",                    icon: "ti-barbell" },
      mall:            { label: "Mall",                   icon: "ti-shopping-bag" },
      worship:         { label: "Worship",       icon: "ti-building-church" },
      fuel:            { label: "Petrol pump",             icon: "ti-gas-station" },
      highway:         { label: "Highway access",                 icon: "ti-road" }
    };

    function formatNearbyPlace(place, fallbackLabel) {
      return place.name || fallbackLabel;
    }

    // One icon+label tile per available category. Tapping it hides the
    // grid and reveals that category's panel — both live as siblings inside
    // the same card (see buildNearbyPlacesSection), so no positioning is
    // needed at all: showing the panel is just a `hidden` class toggle,
    // same mechanism the rest of this file already uses for expand/collapse.
    function buildNearbyTile(key, sectionId) {
      let meta = NEARBY_PLACE_META[key];
      return `
        <button onclick="openNearbyModal('${sectionId}','${key}')"
          class="flex flex-col items-center gap-1.5 py-3 rounded-xl hover:bg-gray-50 transition-colors text-center">
          <i class="ti ${meta.icon} text-gray-400 text-2xl"></i>
          <span class="text-xs font-medium text-gray-600 leading-tight">${meta.label}</span>
        </button>`;
    }

    // candidates is always an array (1-4 items), already sorted in display
    // order by the batch script (chain-match tier, then wiki tier, then
    // distance) — this just renders that order as plain rows, no rank
    // styling or explanation of why the first one is first.
    function buildNearbyPanel(key, candidates, sectionId) {
      let meta = NEARBY_PLACE_META[key];
      let title = key === "highway" ? meta.label : `${meta.label} nearby`;
      let rows = candidates.map(c => `
        <div class="flex justify-between items-start gap-3 py-2 text-sm border-t border-black/5 first:border-t-0">
          <span class="text-gray-700 min-w-0">${formatNearbyPlace(c, meta.label)}</span>
          <span class="font-semibold text-gray-700 text-right shrink-0">${c.distanceKm} km</span>
        </div>`).join("");

      return `
        <div class="hidden" id="nearby-panel-${sectionId}-${key}">
          <div class="flex justify-between items-start mb-3">
            <h3 class="font-semibold text-gray-800 flex items-center gap-2">
              <i class="ti ${meta.icon} text-gray-400 text-lg"></i>
              ${title}
            </h3>
            <button onclick="closeNearbyModal('${sectionId}','${key}')" class="text-gray-400 hover:text-gray-600 text-xl font-bold leading-none">×</button>
          </div>
          <div>${rows}</div>
        </div>`;
    }

    function openNearbyModal(sectionId, key) {
      document.getElementById(`nearby-grid-${sectionId}`).classList.add("hidden");
      document.getElementById(`nearby-panel-${sectionId}-${key}`).classList.remove("hidden");
    }

    function closeNearbyModal(sectionId, key) {
      document.getElementById(`nearby-panel-${sectionId}-${key}`).classList.add("hidden");
      document.getElementById(`nearby-grid-${sectionId}`).classList.remove("hidden");
    }

    // Only categories with at least one candidate are ever shown — a missing
    // category (genuinely nothing tagged nearby, or a failed lookup) is
    // simply absent from the card, not rendered as a placeholder. If NO
    // category has data for this neighbourhood, the whole card is omitted
    // by the caller (see buildScoreCard) rather than showing an empty shell.
    // nearbyPlacesSource: unset (plain dropdown/compare/map — no tag,
    // unchanged), "area" (locateMe/address-search, matched-neighbourhood
    // fallback), "exact" (locateMe/address-search, Hyderabad-core grid
    // cell hit — see getHyderabadGridPlaces). Nearby Places had no
    // precision tag at all before this — the earlier dual-precision work
    // was scoped to the 9 main-card rows only.
    function buildNearbyPlacesSection(nearbyPlaces, sectionId, nearbyPlacesSource) {
      sectionId = sectionId || "single";
      let places = (nearbyPlaces && nearbyPlaces.places) || {};
      let available = Object.keys(NEARBY_PLACE_META).filter(k => places[k] && places[k].candidates && places[k].candidates.length > 0);
      if (available.length === 0) return "";

      let tiles  = available.map(k => buildNearbyTile(k, sectionId)).join("");
      let panels = available.map(k => buildNearbyPanel(k, places[k].candidates, sectionId)).join("");
      let precisionLabel = nearbyPlacesSource === "exact" ? precisionTag("exact for this point")
        : nearbyPlacesSource === "area" ? precisionTag("area estimate")
        : "";

      return `
        <div class="bg-white rounded-2xl p-6">
          <div class="flex items-center gap-2 mb-3">
            <i class="ti ti-map-pin text-gray-500 text-lg"></i>
            <span class="font-semibold text-gray-800">Nearby Places${precisionLabel}</span>
            ${infoBtn('nearbyPlaces')}
          </div>
          <div class="grid grid-cols-3 sm:grid-cols-4 gap-1" id="nearby-grid-${sectionId}">${tiles}</div>
          ${panels}
        </div>`;
    }

    function buildRealEstateSection(nearbyProjects) {
      if (nearbyProjects && nearbyProjects.length > 0) {
        let rows = nearbyProjects.map(p => {
          let details = [p.builder, p.type, p.status];
          if (p.expectedPossession) details.push("expected " + p.expectedPossession);
          let line = details.join(" · ");
          if (p.locationNote) line += " — " + p.locationNote;
          return `
            <div class="border-t border-black/5 py-2.5 text-sm">
              <div class="font-medium text-gray-700">${p.name}</div>
              <div class="text-gray-400 text-xs mt-0.5">${line}</div>
            </div>`;
        }).join("");
        return `
          <div class="bg-white rounded-2xl p-6">
            <div class="flex justify-between items-center gap-2 mb-1">
              <div class="flex items-center gap-2 min-w-0">
                <i class="ti ti-building-community text-gray-500 text-lg shrink-0"></i>
                <span class="font-semibold text-gray-800 truncate">Real Estate</span>
              </div>
              <span class="shrink-0 text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">Informational only</span>
            </div>
            <div>${rows}</div>
            <div class="pt-3 mt-1 border-t border-black/5 text-xs">
              <a href="${nearbyProjects[0].verifyUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-500 hover:underline">Verify on the state RERA portal →</a>
              <div class="text-gray-400 mt-1">Search a project's name on the portal to confirm its current status and registration number.</div>
            </div>
          </div>`;
      }

      return `
        <div class="bg-gray-50 rounded-2xl p-6">
          <div class="flex items-center gap-2 mb-1">
            <i class="ti ti-building-community text-gray-400 text-lg"></i>
            <span class="font-semibold text-gray-500">Real Estate</span>
          </div>
          <div class="text-sm text-gray-400">Real estate data coming soon for this neighbourhood.</div>
        </div>`;
    }

    // Approximates a "better than X% of neighbourhoods" ranking using only
    // static baseline fields (no extra live AQI/weather fetches per neighbour
    // in the city, which would multiply API calls ~10x for one lookup).
    // Weights are the finalScore weights for the 7 static params, renormalized
    // to sum to 1 since aqi/heat (which need live data) are excluded here.
    function computeBenchmarkPercentile(d) {
      const w = { ndvi: 0.2647, water: 0.2206, infra: 0.1471, walk: 0.1176, noise: 0.1029, safety: 0.0882, traffic: 0.0588 };
      function staticScore(n) {
        return (calculateNDVIScore(n.ndvi) * w.ndvi)
          + (calculateWaterScore(n.water) * w.water)
          + (n.infra * w.infra)
          + (n.walk * w.walk)
          + (n.noise * w.noise)
          + (n.safety * w.safety)
          + (n.traffic * w.traffic);
      }
      let neighbourhoods = cities[d.city] || [];
      if (neighbourhoods.length <= 1) return 100;
      let currentEntry = neighbourhoods.find(n => n.name === d.name);
      if (!currentEntry) return 50;
      let currentScore = staticScore(currentEntry);
      let betterCount = neighbourhoods.filter(n => staticScore(n) < currentScore).length;
      return Math.round((betterCount / (neighbourhoods.length - 1)) * 100);
    }

    function buildScoreCard(d, highlight, chartId, isAreaEstimate, nearbyPlacesSource) {
      chartId = chartId || "single";
      let ringClass    = highlight ? "ring-2 ring-green-400 ring-offset-2" : "";
      let badge        = highlight ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full ml-2">Better area</span>' : "";
      let band         = getBandInfo(d.finalScore);
      let cityName     = d.city.charAt(0).toUpperCase() + d.city.slice(1);
      let benchmarkPct = computeBenchmarkPercentile(d);

      return `
        <div class="rounded-2xl p-2 ${ringClass}">
          <div class="text-center mb-5">
            <div class="text-lg font-bold text-gray-800">${d.name}</div>
            <div class="text-sm text-gray-400">${cityName}</div>
            <div class="flex items-center justify-center gap-2 mt-3">
              <span class="text-6xl font-bold ${band.text}">${Math.round(d.finalScore * 10)}</span>
              ${infoBtn('score')}
              ${badge}
            </div>
            <div class="text-base font-medium ${band.text}">${band.label}</div>
            <div class="text-xs text-gray-400 mt-2">Better than ${benchmarkPct}% of neighbourhoods in ${cityName}</div>
          </div>
          <div class="space-y-4">
            ${buildEnvironmentalCard(d, chartId, isAreaEstimate)}
            ${buildLiveabilityCard(d, isAreaEstimate)}
            ${buildNearbyPlacesSection(d.nearbyPlaces, chartId, nearbyPlacesSource)}
            ${buildRealEstateSection(d.nearbyProjects)}
          </div>
          <div class="pt-4 text-center text-xs text-gray-400">
            AQI and weather are live. Green cover from ESA satellites. Infrastructure, transit & amenity access, and noise are computed from real OpenStreetMap distances, refreshed periodically. Water, traffic and safety are from researched baseline data. Nearby places from OpenStreetMap, refreshed periodically.
          </div>
        </div>`;
    }

    const AQI_TREND_MIN_POINTS = 12;

    // Fetches the last 24h of this neighbourhood's AQI snapshots directly
    // from Supabase (read-only, anon key) and renders a line chart — but
    // only if there's enough real data to be meaningful. Fewer than
    // AQI_TREND_MIN_POINTS rows, or any fetch failure, shows a plain
    // "still building up" message instead of a sparse or broken chart.
    async function loadAqiTrend(name, city, chartId) {
      const statusEl = document.getElementById(`aqi-trend-${chartId}-status`);
      const wrapEl   = document.getElementById(`aqi-trend-${chartId}-chart-wrap`);
      const canvasEl = document.getElementById(`aqi-trend-${chartId}-canvas`);
      if (!statusEl || !wrapEl || !canvasEl) return;

      if (aqiTrendCharts[chartId]) {
        aqiTrendCharts[chartId].destroy();
        delete aqiTrendCharts[chartId];
      }
      // loadAqiTrend runs exactly once per fresh card render (unlike the
      // daily view, which loads lazily on tab click) — piggybacking the
      // daily chart/lazy-load-flag reset here guarantees a new render
      // always starts clean, even if "History" was left open on a
      // previous card reusing the same chartId (e.g. repeated single-mode
      // searches). Without this, switching neighbourhoods while History
      // was active would show the PREVIOUS neighbourhood's stale chart
      // under the new one's data until manually re-clicked.
      if (dailyTrendCharts[chartId]) {
        dailyTrendCharts[chartId].destroy();
        delete dailyTrendCharts[chartId];
      }
      delete dailyTrendLoadedFor[chartId];
      document.getElementById(`trend-view-hourly-${chartId}`)?.classList.remove("hidden");
      document.getElementById(`trend-view-daily-${chartId}`)?.classList.add("hidden");
      const hourlyTabReset = document.getElementById(`trend-tab-hourly-${chartId}`);
      const dailyTabReset  = document.getElementById(`trend-tab-daily-${chartId}`);
      if (hourlyTabReset) hourlyTabReset.className = "text-xs font-medium px-2 py-1 rounded-full bg-gray-800 text-white";
      if (dailyTabReset)  dailyTabReset.className  = "text-xs font-medium px-2 py-1 rounded-full text-gray-500 hover:bg-gray-100";

      const showNotEnoughData = () => {
        statusEl.textContent = "Building up today's trend — check back soon";
        statusEl.classList.remove("hidden");
        wrapEl.classList.add("hidden");
      };

      try {
        const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
        const url = SUPABASE_URL + "/rest/v1/score_snapshots"
          + "?select=aqi,created_at"
          + "&neighbourhood=eq." + encodeURIComponent(name)
          + "&city=eq." + encodeURIComponent(city)
          + "&created_at=gte." + encodeURIComponent(since)
          + "&order=created_at.asc";

        const res = await fetch(url, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY
          }
        });

        if (!res.ok) throw new Error("Supabase request failed: " + res.status);
        const rows = await res.json();

        if (!Array.isArray(rows) || rows.length < AQI_TREND_MIN_POINTS) {
          showNotEnoughData();
          return;
        }

        const labels = rows.map(r => new Date(r.created_at).toLocaleTimeString("en-IN", {
          timeZone: "Asia/Kolkata", hour: "numeric"
        }));
        const values = rows.map(r => r.aqi);

        statusEl.classList.add("hidden");
        wrapEl.classList.remove("hidden");

        aqiTrendCharts[chartId] = new Chart(canvasEl, {
          type: "line",
          data: {
            labels,
            datasets: [{
              label: "AQI",
              data: values,
              borderColor: "#2563eb",
              backgroundColor: "rgba(37, 99, 235, 0.08)",
              fill: true,
              tension: 0.3,
              pointRadius: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { maxTicksLimit: 6, font: { size: 10 } }, grid: { display: false } },
              y: { ticks: { font: { size: 10 } }, beginAtZero: true }
            }
          }
        });
      } catch (err) {
        console.warn("AQI trend fetch failed — showing fallback message", err);
        showNotEnoughData();
      }
    }

    function switchTrendView(chartId, view, name, city) {
      const hourlyView = document.getElementById(`trend-view-hourly-${chartId}`);
      const dailyView  = document.getElementById(`trend-view-daily-${chartId}`);
      const hourlyTab  = document.getElementById(`trend-tab-hourly-${chartId}`);
      const dailyTab   = document.getElementById(`trend-tab-daily-${chartId}`);
      if (!hourlyView || !dailyView || !hourlyTab || !dailyTab) return;

      const activeTab   = "text-xs font-medium px-2 py-1 rounded-full bg-gray-800 text-white";
      const inactiveTab = "text-xs font-medium px-2 py-1 rounded-full text-gray-500 hover:bg-gray-100";

      if (view === "hourly") {
        hourlyView.classList.remove("hidden");
        dailyView.classList.add("hidden");
        hourlyTab.className = activeTab;
        dailyTab.className  = inactiveTab;
      } else {
        hourlyView.classList.add("hidden");
        dailyView.classList.remove("hidden");
        hourlyTab.className = inactiveTab;
        dailyTab.className  = activeTab;
        // Fetch only the first time this tab is opened for the current
        // card render — loadAqiTrend clears this flag on every fresh
        // render, so a new search still gets a fresh fetch even if
        // History was left open on a previous card reusing this chartId.
        if (!dailyTrendLoadedFor[chartId]) {
          dailyTrendLoadedFor[chartId] = true;
          loadDailyTrend(name, city, chartId);
        }
      }
    }

    const DAILY_TREND_MIN_DAYS = 3;
    const DAILY_TREND_WINDOW_DAYS = 90;

    // Daily-average companion to loadAqiTrend above: same Supabase table,
    // same read-only anon-key REST pattern, but grouped into one point per
    // calendar day (AQI + Green Score) instead of raw hourly points — 90
    // days of hourly data would be too dense to read as a chart. Requested
    // window is 90 days, but the label always reflects how many distinct
    // days actually came back (see below), not the requested window — so
    // this reads honestly today (currently ~8 real days exist, per direct
    // Supabase query) and keeps extending on its own as more real days
    // accumulate, with no code change ever needed here again.
    //
    // KNOWN DATA DISCONTINUITY — not a bug if you see a "jump": Howrah,
    // Hadapsar, and Magarpatta had their stored coordinates corrected in
    // commit 6fe9b36 (2026-07-10 00:10 IST — Howrah was 6.8km off; Hadapsar
    // and Magarpatta shared one identical coordinate). Rajarhat, Dumdum,
    // Prahlad Nagar, and SG Highway were corrected in commit a249428
    // (2026-07-10 21:59 IST — see that commit message for per-neighbourhood
    // detail, e.g. Dumdum's point had reverse-geocoded into Baranagar).
    // score_snapshots' earliest row predates both (2026-07-05), so for
    // these 7 specifically, rows before their correction timestamp reflect
    // live AQI/weather at the OLD (wrong) point, blended here into the same
    // daily-average line as rows after using the corrected point — a real,
    // physical discontinuity in the underlying data, not a rendering bug.
    // No special handling is applied for it yet (per explicit decision —
    // too few days of history overall right now to be worth building UI
    // around), but worth knowing before treating a visible jump in one of
    // these 7 neighbourhoods' history as something to debug.
    async function loadDailyTrend(name, city, chartId) {
      const statusEl = document.getElementById(`daily-trend-${chartId}-status`);
      const wrapEl   = document.getElementById(`daily-trend-${chartId}-chart-wrap`);
      const canvasEl = document.getElementById(`daily-trend-${chartId}-canvas`);
      const labelEl  = document.getElementById(`daily-trend-${chartId}-label`);
      if (!statusEl || !wrapEl || !canvasEl || !labelEl) return;

      if (dailyTrendCharts[chartId]) {
        dailyTrendCharts[chartId].destroy();
        delete dailyTrendCharts[chartId];
      }

      const showNotEnoughData = () => {
        labelEl.textContent = "";
        statusEl.textContent = "Building up the daily trend — check back in a few days";
        statusEl.classList.remove("hidden");
        wrapEl.classList.add("hidden");
      };

      try {
        const since = new Date(Date.now() - DAILY_TREND_WINDOW_DAYS * 24 * 60 * 60 * 1000).toISOString();
        const url = SUPABASE_URL + "/rest/v1/score_snapshots"
          + "?select=aqi,overall_score,created_at"
          + "&neighbourhood=eq." + encodeURIComponent(name)
          + "&city=eq." + encodeURIComponent(city)
          + "&created_at=gte." + encodeURIComponent(since)
          + "&order=created_at.asc";

        const res = await fetch(url, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY
          }
        });

        if (!res.ok) throw new Error("Supabase request failed: " + res.status);
        const rows = await res.json();

        // Group by LOCAL (Asia/Kolkata) calendar date — same timezone
        // convention loadAqiTrend's own hourly labels already use. Rows
        // arrive created_at-ascending, and a Map preserves insertion
        // order, so the grouped days come out chronologically sorted with
        // no separate sort step needed.
        const byDay = new Map();
        for (const r of rows) {
          const dayKey = new Date(r.created_at).toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
          if (!byDay.has(dayKey)) byDay.set(dayKey, { aqiSum: 0, scoreSum: 0, count: 0 });
          const g = byDay.get(dayKey);
          g.aqiSum += r.aqi;
          g.scoreSum += r.overall_score;
          g.count++;
        }

        const dayKeys = [...byDay.keys()];
        if (dayKeys.length < DAILY_TREND_MIN_DAYS) {
          showNotEnoughData();
          return;
        }

        const labels = dayKeys.map(k => new Date(k + "T00:00:00").toLocaleDateString("en-IN", {
          timeZone: "Asia/Kolkata", month: "short", day: "numeric"
        }));
        const aqiValues   = dayKeys.map(k => Math.round(byDay.get(k).aqiSum / byDay.get(k).count));
        // overall_score is stored 0-10 (see calculateFinalScore) — x10 to
        // match how the score is displayed everywhere else in this app.
        const scoreValues = dayKeys.map(k => Math.round((byDay.get(k).scoreSum / byDay.get(k).count) * 10));

        labelEl.textContent = `Last ${dayKeys.length} day${dayKeys.length === 1 ? "" : "s"}`;
        statusEl.classList.add("hidden");
        wrapEl.classList.remove("hidden");

        dailyTrendCharts[chartId] = new Chart(canvasEl, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "AQI", data: aqiValues, yAxisID: "y",
                borderColor: "#2563eb", backgroundColor: "rgba(37, 99, 235, 0.08)",
                fill: true, tension: 0.3, pointRadius: 2
              },
              {
                label: "Green Score", data: scoreValues, yAxisID: "y1",
                borderColor: "#16a34a", backgroundColor: "transparent",
                fill: false, tension: 0.3, pointRadius: 2
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: true, labels: { boxWidth: 10, font: { size: 10 } } } },
            scales: {
              x:  { ticks: { maxTicksLimit: 6, font: { size: 10 } }, grid: { display: false } },
              y:  { position: "left",  beginAtZero: true, ticks: { font: { size: 10 } }, title: { display: true, text: "AQI", font: { size: 9 } } },
              y1: { position: "right", beginAtZero: true, max: 100, ticks: { font: { size: 10 } }, grid: { drawOnChartArea: false }, title: { display: true, text: "Score", font: { size: 9 } } }
            }
          }
        });
      } catch (err) {
        console.warn("Daily trend fetch failed — showing fallback message", err);
        showNotEnoughData();
      }
    }

    async function checkSingle() {
      clearUserLocationPin();
      let city     = document.getElementById("city-select").value;
      let nVal     = document.getElementById("neighbourhood-select").value;
      let statusEl = document.getElementById("single-status");
      let resultEl = document.getElementById("single-result");
      statusEl.innerHTML = getSpinner();
      resultEl.classList.add("hidden");
      try {
        let d = await fetchAreaData(city, nVal);
        statusEl.innerHTML = "";
        resultEl.innerHTML = buildScoreCard(d, false, "single");
        resultEl.classList.remove("hidden");
        loadAqiTrend(d.name, d.city, "single");
      } catch (err) {
        statusEl.innerHTML = "Could not load data. Check console (F12).";
        console.error(err);
      }
    }

    async function checkCompare() {
      clearUserLocationPin();
      let cityA    = document.getElementById("city-a").value;
      let cityB    = document.getElementById("city-b").value;
      let nValA    = document.getElementById("neighbourhood-a").value;
      let nValB    = document.getElementById("neighbourhood-b").value;
      let statusEl = document.getElementById("compare-status");
      let resultEl = document.getElementById("compare-result");
      statusEl.innerHTML = getSpinner();
      resultEl.classList.add("hidden");
      try {
        let [dA, dB] = await Promise.all([
          fetchAreaData(cityA, nValA),
          fetchAreaData(cityB, nValB)
        ]);
        let aWins = dA.finalScore > dB.finalScore;
        let tie   = dA.finalScore === dB.finalScore;
        let summary = tie
          ? '<div class="text-center text-sm text-gray-500 mb-4">Both areas scored equally</div>'
          : `<div class="text-center text-sm text-gray-500 mb-4">
               <span class="font-medium text-green-600">${aWins ? dA.name : dB.name}</span>
               scores ${Math.abs(dA.finalScore - dB.finalScore).toFixed(1)} points higher
             </div>`;
        // The immersive card design (generous padding, large icon+label+value
        // rows) needs full width to render without wrapping/overflow — a
        // side-by-side 2-column grid doesn't leave enough room per card at
        // typical widths, and redesigning for that is explicitly out of scope
        // here. Stack the two full-width cards vertically instead.
        statusEl.innerHTML = "";
        resultEl.innerHTML = summary +
          '<div class="space-y-6">' +
          buildScoreCard(dA, aWins && !tie, "compare-a") +
          buildScoreCard(dB, !aWins && !tie, "compare-b") +
          '</div>';
        resultEl.classList.remove("hidden");
        loadAqiTrend(dA.name, dA.city, "compare-a");
        loadAqiTrend(dB.name, dB.city, "compare-b");
      } catch (err) {
        statusEl.innerHTML = "Could not load data. Check console (F12).";
        console.error(err);
      }
    }

    // Live-fetches every neighbourhood in `city` via the exact same
    // fetchAreaData used everywhere else in the app (not a separate,
    // possibly-stale Supabase snapshot), so a pin's color always matches
    // what tapping into it shows — fetchAreaData's own 10-minute cache means
    // the tap-in call below hits the cache and returns the identical object
    // that colored the pin. Trade-off: this also live-fetches NDVI/Sentinel
    // Hub once per neighbourhood per map load (fetchAreaData always does
    // this, before its own cache check), unlike the Phase 2 snapshot
    // pipeline which deliberately skips NDVI to save quota — accepted here
    // since guaranteed pin/card consistency was the explicit priority.
    const MAP_CONCURRENCY = 5;

    async function loadCityMap(city) {
      mapState.initialized = true;

      const statusEl = document.getElementById("map-status");
      const resultEl = document.getElementById("map-result");
      resultEl.classList.add("hidden");
      resultEl.innerHTML = "";
      statusEl.textContent = "Loading neighbourhoods…";

      mapState.markers.forEach(m => m.remove());
      mapState.markers = [];
      if (mapState.userMarker) { mapState.userMarker.remove(); mapState.userMarker = null; }
      if (mapState.userLine)   { mapState.userLine.remove();   mapState.userLine   = null; }

      const neighbourhoods = cities[city] || [];
      if (neighbourhoods.length === 0) {
        statusEl.textContent = "No neighbourhoods available for this city.";
        return;
      }

      if (!mapState.leafletMap) {
        mapState.leafletMap = L.map("map-container");
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors",
          maxZoom: 18
        }).addTo(mapState.leafletMap);
      }

      const avgLat = neighbourhoods.reduce((sum, n) => sum + n.lat, 0) / neighbourhoods.length;
      const avgLon = neighbourhoods.reduce((sum, n) => sum + n.lon, 0) / neighbourhoods.length;
      mapState.leafletMap.setView([avgLat, avgLon], 11);
      // Leaflet mis-measures its container if it was hidden (display:none)
      // at construction time — map-mode's hidden class is removed just
      // before this runs, but the browser needs a tick to lay it out.
      setTimeout(() => mapState.leafletMap.invalidateSize(), 0);

      // Batched concurrency — same lesson learned in Phase 2's snapshot
      // pipeline (open-meteo returns 429 above ~5 concurrent requests).
      for (let i = 0; i < neighbourhoods.length; i += MAP_CONCURRENCY) {
        const chunk = neighbourhoods.slice(i, i + MAP_CONCURRENCY);
        await Promise.all(chunk.map(async n => {
          const value = n.lat + "|" + n.lon + "|" + n.name + "|" + n.ndvi + "|" +
            n.noise + "|" + n.water + "|" + n.traffic + "|" + n.safety + "|" + n.infra + "|" + n.walk;

          let pinClass = "bg-gray-400";
          let label = n.name;
          try {
            const d = await fetchAreaData(city, value);
            const band = getBandInfo(d.finalScore);
            pinClass = band.pin;
            label = `${n.name} · ${Math.round(d.finalScore * 10)}`;
          } catch (err) {
            console.warn("Map pin data failed for " + n.name, err);
            label += " · data unavailable";
          }

          const icon = L.divIcon({
            className: "",
            html: `<div class="aqi-pin ${pinClass}"></div>`,
            iconSize: [18, 18]
          });
          const marker = L.marker([n.lat, n.lon], { icon }).addTo(mapState.leafletMap);
          marker.bindTooltip(label);
          marker.on("click", () => showMapPinResult(n.name, city));
          mapState.markers.push(marker);
        }));
      }

      // "You are here" marker — only for the city it was actually matched
      // in, and only while mapState.userLocation is still set (cleared by
      // clearUserLocationPin() on any new search or on leaving map view).
      if (mapState.userLocation && mapState.userLocation.city === city) {
        const { lat, lon, matchedName, distanceKm } = mapState.userLocation;

        const userIcon = L.divIcon({
          className: "",
          html: '<div class="user-location-pin"><i class="ti ti-current-location"></i></div>',
          iconSize: [26, 26]
        });
        mapState.userMarker = L.marker([lat, lon], { icon: userIcon, zIndexOffset: 1000 })
          .addTo(mapState.leafletMap)
          .bindTooltip("Your location");

        const matchedEntry = neighbourhoods.find(n => n.name === matchedName);
        if (matchedEntry) {
          mapState.userLine = L.polyline(
            [[lat, lon], [matchedEntry.lat, matchedEntry.lon]],
            { color: "#2563eb", weight: 2, dashArray: "4 6", opacity: 0.7 }
          ).addTo(mapState.leafletMap)
           .bindTooltip(distanceKm.toFixed(1) + " km", { permanent: true, direction: "center", className: "text-xs" });
        }
      }

      statusEl.textContent = "";
    }

    async function showMapPinResult(name, city) {
      const resultEl = document.getElementById("map-result");
      const entry = (cities[city] || []).find(n => n.name === name);
      if (!entry) return;

      const value = entry.lat + "|" + entry.lon + "|" + entry.name + "|" + entry.ndvi + "|" +
        entry.noise + "|" + entry.water + "|" + entry.traffic + "|" + entry.safety + "|" + entry.infra + "|" + entry.walk;

      resultEl.innerHTML = getSpinner();
      resultEl.classList.remove("hidden");
      try {
        // Hits fetchAreaData's cache — this is the same call loadCityMap
        // just made to color this pin, so the card shown here is guaranteed
        // identical to what determined the pin's color.
        const d = await fetchAreaData(city, value);
        resultEl.innerHTML = buildScoreCard(d, false, "map");
        loadAqiTrend(d.name, d.city, "map");
        resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      } catch (err) {
        resultEl.innerHTML = '<div class="text-sm text-gray-400 text-center">Could not load data. Check console (F12).</div>';
        console.error(err);
      }
    }

    // Same formula as api/aqi.js's haversineKm — reimplemented client-side
    // since that file is a server-only Node module and every neighbourhood's
    // coordinates are already available here in `cities`, so no server
    // round-trip is needed for this.
    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2
        + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Tightened from an initially-proposed 50km (matching api/aqi.js's own
    // station-distance sanity check) down to 15km — a "closest match" 50km
    // away isn't really "their area" the way a same-city neighbourhood is.
    const LOCATE_ME_MAX_DISTANCE_KM = 15;

    function findNearestNeighbourhood(lat, lon) {
      let nearest = null;
      let nearestDistanceKm = Infinity;
      Object.keys(cities).forEach(city => {
        cities[city].forEach(entry => {
          const distanceKm = haversineKm(lat, lon, entry.lat, entry.lon);
          if (distanceKm < nearestDistanceKm) {
            nearestDistanceKm = distanceKm;
            nearest = { entry, city, distanceKm };
          }
        });
      });
      return nearest;
    }

    const GRID_LOOKUP_TIMEOUT_MS = 8000;

    // Checks whether an exact searched point (typed address or GPS) falls
    // within the validated Hyderabad-core grid (2200 cells, 500m spacing)
    // and, if so, returns that cell's own Nearby Places instead of the
    // matched neighbourhood's pre-computed list. Completely orthogonal to
    // findNearestNeighbourhood() above — that one still always drives the
    // whole score card (AQI/weather/NDVI/baseline fields); this only ever
    // affects which Nearby Places list gets shown, and only for Hyderabad.
    //
    // The grid data itself (23.35MB) stays server-side — api/
    // hyderabad-grid-lookup.js reads it once at module load and returns
    // just the matched cell (a few KB), not the whole file. On any
    // failure (timeout, non-2xx, network error, or a genuine miss outside
    // the grid's bounding box) this returns { inGrid: false }, and callers
    // fall back to the existing matched-neighbourhood behavior unchanged —
    // never blocks or breaks the rest of the result.
    async function getHyderabadGridPlaces(lat, lon) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), GRID_LOOKUP_TIMEOUT_MS);
      try {
        const res = await fetch(`/api/hyderabad-grid-lookup?lat=${lat}&lon=${lon}`, { signal: controller.signal });
        const data = await res.json();
        if (!res.ok || !data.inGrid) return { inGrid: false };
        return { inGrid: true, places: data.places };
      } catch (err) {
        console.warn("Hyderabad grid lookup failed — using matched-neighbourhood Nearby Places instead.", err.message);
        return { inGrid: false };
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function loadExactLocationNdvi(lat, lon, containerId) {
      const statusEl = document.getElementById(containerId + "-status");
      if (!statusEl) return;

      const showUnavailable = () => {
        statusEl.textContent = "Green cover reading unavailable for this exact point right now.";
      };

      try {
        const res  = await fetch("/api/ndvi?lat=" + lat + "&lon=" + lon);
        const data = await res.json();

        if (!res.ok) {
          console.warn(`Exact-location NDVI request failed (HTTP ${res.status}). Reason: ${data.reason || data.error || "unknown"}`);
          showUnavailable();
          return;
        }
        if (typeof data.ndvi !== "number") {
          console.warn(`Exact-location NDVI returned no usable reading. Reason: ${data.reason || "unknown"}`);
          showUnavailable();
          return;
        }
        statusEl.textContent = `NDVI ${data.ndvi} · ${getNDVILabel(data.ndvi)}`;
      } catch (err) {
        console.warn("Exact-location NDVI fetch threw an exception (network/parse error).", err.message);
        showUnavailable();
      }
    }

    // Never sends the coordinate anywhere persistent — used only to compute
    // the nearest neighbourhood (client-side haversine) and, for the bonus
    // NDVI reading, one read-only call to /api/ndvi (which itself performs
    // a Sentinel Hub computation and returns a value, nothing is stored).
    function locateMe() {
      const statusEl = document.getElementById("locate-me-status");

      if (!navigator.geolocation) {
        statusEl.textContent = "Geolocation isn't supported in this browser.";
        return;
      }

      statusEl.textContent = "Requesting your location…";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;

          const nearest = findNearestNeighbourhood(latitude, longitude);
          if (!nearest || nearest.distanceKm > LOCATE_ME_MAX_DISTANCE_KM) {
            statusEl.textContent = "No closely-matched neighbourhood found near your location.";
            return;
          }
          statusEl.textContent = "";

          setMode("single");
          const singleStatusEl = document.getElementById("single-status");
          const resultEl       = document.getElementById("single-result");
          singleStatusEl.innerHTML = getSpinner();
          resultEl.classList.add("hidden");

          const { entry, city, distanceKm } = nearest;
          const value = entry.lat + "|" + entry.lon + "|" + entry.name + "|" + entry.ndvi + "|" +
            entry.noise + "|" + entry.water + "|" + entry.traffic + "|" + entry.safety + "|" + entry.infra + "|" + entry.walk;

          try {
            // Run in parallel, not sequentially after fetchAreaData — same
            // reasoning as selectAddressSuggestion's identical wiring.
            const [d, gridResult] = await Promise.all([
              fetchAreaData(city, value),
              getHyderabadGridPlaces(latitude, longitude)
            ]);
            singleStatusEl.innerHTML = "";

            let nearbyPlacesSource = "area";
            if (gridResult.inGrid) {
              d.nearbyPlaces = { places: gridResult.places };
              nearbyPlacesSource = "exact";
            }

            // Available for Map view to render the "you are here" marker if
            // the person switches there — see clearUserLocationPin() for
            // when this gets forgotten again. Never sent anywhere.
            mapState.userLocation = { lat: latitude, lon: longitude, city, matchedName: d.name, distanceKm };

            const distanceNote = `
              <div class="text-center text-sm text-gray-500 mb-3">
                Closest matched area: <span class="font-medium text-gray-700">${d.name}</span>
                (${distanceKm.toFixed(1)}km from your location)
              </div>`;
            const ndviContainerId = "exact-ndvi-single";
            const exactNdviBlock = `
              <div class="mt-4 bg-white border border-gray-100 rounded-2xl p-4 text-sm" id="${ndviContainerId}">
                <div class="text-xs text-gray-500 mb-1">Green cover${precisionTag("exact for this point")}</div>
                <div id="${ndviContainerId}-status" class="text-xs text-gray-400">Loading…</div>
              </div>`;

            resultEl.innerHTML = distanceNote + buildScoreCard(d, false, "single", true, nearbyPlacesSource) + exactNdviBlock;
            resultEl.classList.remove("hidden");
            loadAqiTrend(d.name, d.city, "single");
            loadExactLocationNdvi(latitude, longitude, ndviContainerId);
            resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
          } catch (err) {
            singleStatusEl.innerHTML = "Could not load data. Check console (F12).";
            console.error(err);
          }
        },
        (error) => {
          if (error.code === error.PERMISSION_DENIED) {
            statusEl.textContent = "Location access declined — search or browse the map instead.";
          } else {
            statusEl.textContent = "Couldn't get your location — try search instead.";
          }
        }
      );
    }

    updateNeighbourhoods("neighbourhood-select", "city-select");
    updateNeighbourhoods("neighbourhood-a", "city-a");
    updateNeighbourhoods("neighbourhood-b", "city-b");

  </script>

</body>
</html>
